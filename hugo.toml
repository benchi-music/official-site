baseURL = 'https://benchi-music.github.io/official-site/'
defaultContentLanguage = 'ja'
title = 'ベンチ'
theme = 'PaperMod'

[params.label]
  text = "ベンチ"
  icon = "images/logo.png"
  iconHeight = 75

[params]
  env = "production"
  mainSections = ["blog"]
  description = "音楽グループの公式サイト"
  author = "ベンチ"
  images = ["images/logo.png"]
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  # GoatCounter サイトコード。https://www.goatcounter.com/ でサイト作成後、
  # 発行される code（例: https://XXXX.goatcounter.com の XXXX 部分）を設定する
  goatcounter_code = "benchi-music"

[params.social]
  twitter = "577CZ5iYuwf5zkL"

[params.homeInfoParams]
  Title = "ベンチ"
  Content = "音楽グループ「ベンチ」の公式サイトです。\n\nJ-POPの正統進化を目指して曲を作っています。  \n懐かしさと新しさが同居した音楽——自称「**J-POPS**」。\n\n聴いてくれた人の背中をほんの少し押したり、世界へのピントをちょっとだけ変えたりする、  \nそんなささやかな応援のような等身大の音楽を目指しています。"

[[params.socialIcons]]
  name = "twitter"
  url = "https://twitter.com/577CZ5iYuwf5zkL"

[[params.socialIcons]]
